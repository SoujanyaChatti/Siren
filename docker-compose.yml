# Local dev: TimescaleDB + SIREN backend (which also serves the built frontend).
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: siren
      POSTGRES_DB: siren
    ports: ["5432:5432"]
    volumes: [tsdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siren"]
      interval: 3s
      retries: 20
  siren:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://postgres:siren@timescaledb:5432/siren
    ports: ["8000:8000"]
    depends_on:
      timescaledb: {condition: service_healthy}
volumes:
  tsdata:
